<!-- Add movie modal -->
<div
    id="add-modal"
    class="fixed inset-0 bg-black/75 flex items-center justify-center z-50 hidden"
>
    <div class="bg-(--primary-color) rounded-lg p-6 w-auto max-w-2xl mx-4 max-h-[85vh] overflow-y-auto">
        <form
            id="add-form"
            method="post"
            class="grid grid-cols-1 md:grid-cols-3 gap-6"
            action="/add_movie"
        >
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="movie_add" id="movie_add" value="">
            <div>
                <label for="title" class="font-semibold">Titre du film</label>
                <input
                    id="title"
                    name="title"
                    type="text"
                    placeholder="Tapez pour rechercher..."
                    required
                    autocomplete="off"
                    aria-autocomplete="list"
                    aria-controls="corresponding-poster"
                    class="w-full p-2 border border-(--secondary-color) bg-(--primary-color) text-(--secondary-color) placeholder-(--secondary-color) rounded mb-2"
                />
                <p class="text-xs text-gray-500 mb-2">Résultats mis à jour à la frappe</p>

                <div id="corresponding-poster" role="listbox" class="grid grid-cols-3 gap-2 max-w-full min-h-[1rem] overflow-hidden mb-4">
                </div>

                <label for="date">Date de visionnage</label>
                <input
                    id="date"
                    name="date"
                    type="date"
                    class="w-full p-2 border border-(--secondary-color) bg-(--primary-color) text-(--secondary-color) placeholder-(--secondary-color) rounded mb-4"
                />
                <br />

                <label for="rating">Note personnelle</label>
                <input
                    id="rating"
                    name="rating"
                    type="number"
                    min="0"
                    max="100"
                    step="1"
                    placeholder="Note sur 100"
                    class="w-full p-2 border border-(--secondary-color) bg-(--primary-color) text-(--secondary-color) placeholder-(--secondary-color) rounded mb-4"
                />
                <br />
            </div>

            <div class="col-span-2">
                <label for="summary">Résumé</label>
                <textarea
                    id="summary"
                    name="summary"
                    rows="6"
                    placeholder="Résumé personnel"
                    class="w-full p-2 border border-(--secondary-color) bg-(--primary-color) text-(--secondary-color) placeholder-(--secondary-color) rounded mb-4"
                ></textarea>
                <br />

                <label for="review">Avis</label>
                <textarea
                    id="review"
                    name="review"
                    rows="6"
                    placeholder="Avis sur le film"
                    class="w-full p-2 border border-(--secondary-color) bg-(--primary-color) text-(--secondary-color) placeholder-(--secondary-color) rounded mb-4"
                ></textarea>
                <br />
            </div>

            <div class="col-span-3 items-center justify-center text-center">
                <button
                    type="submit"
                    id="grid-submit"
                    disabled
                    class="p-2 border border-(--secondary-color) bg-(--primary-color) text-(--secondary-color) rounded mb-4 disabled:opacity-50 disabled:cursor-not-allowed"
                >
                    Envoyer
                </button>
            </div>
        </form>
    </div>
</div>
