<!-- Add movie modal -->
<div
    id="add-modal"
    class="fixed inset-0 bg-black/75 flex items-center justify-center z-50 hidden p-4"
>
    <div class="bg-(--primary-color) rounded-lg p-6 sm:p-8 w-[98vw] max-w-7xl mx-auto max-h-[92vh] overflow-y-auto">
        <form
            id="add-form"
            method="post"
            class="grid grid-cols-1 md:grid-cols-3 gap-6 md:gap-8"
            action="/add_movie"
        >
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="movie_add" id="movie_add" value="">
            <div class="flex flex-col md:row-span-2 xl:row-span-1">
                <label for="title" class="font-semibold">Titre du film</label>
                <input
                    id="title"
                    name="title"
                    type="text"
                    placeholder="Tapez pour rechercher..."
                    required
                    autocomplete="off"
                    aria-autocomplete="list"
                    aria-controls="corresponding-poster"
                    class="w-full p-2 border border-(--secondary-color) bg-(--primary-color) text-(--secondary-color) placeholder-(--secondary-color) rounded mb-2"
                />
                <p class="text-xs text-gray-500 mb-2">Résultats mis à jour à la frappe</p>

                <div id="corresponding-poster" role="listbox" class="grid grid-cols-3 gap-3 max-w-full min-h-[1rem] overflow-hidden mb-4">
                </div>

                <label for="date">Date de visionnage</label>
                <input
                    id="date"
                    name="date"
                    type="date"
                    class="w-full p-2 border border-(--secondary-color) bg-(--primary-color) text-(--secondary-color) placeholder-(--secondary-color) rounded mb-4"
                />
                <br />

                <label for="rating">Note personnelle</label>
                <input
                    id="rating"
                    name="rating"
                    type="number"
                    min="0"
                    max="100"
                    step="1"
                    placeholder="Note sur 100"
                    class="w-full p-2 border border-(--secondary-color) bg-(--primary-color) text-(--secondary-color) placeholder-(--secondary-color) rounded mb-4"
                />

                <div class="mt-auto pt-4 text-center">
                    <button
                        type="submit"
                        id="grid-submit"
                        disabled
                        class="w-auto min-w-[160px] px-8 py-2 border border-(--secondary-color) bg-(--primary-color) text-(--secondary-color) rounded disabled:opacity-50 disabled:cursor-not-allowed"
                    >
                        Envoyer
                    </button>
                </div>
            </div>

            <div class="flex flex-col md:col-start-2 md:col-span-2 xl:col-start-2 xl:col-span-1 xl:row-start-1">
                <label for="summary">Résumé</label>
                <textarea
                    id="summary"
                    name="summary"
                    rows="5"
                    maxlength="5000"
                    placeholder="Résumé personnel"
                    class="w-full md:h-40 xl:h-auto xl:flex-1 p-2 border border-(--secondary-color) bg-(--primary-color) text-(--secondary-color) placeholder-(--secondary-color) rounded mb-1"
                ></textarea>
                <p id="summary-warning" class="text-amber-500 text-xs hidden mb-2">Attention : vous approchez de la limite (<span id="summary-count">0</span>/5000)</p>
            </div>

            <div class="flex flex-col md:col-start-2 md:col-span-2 xl:col-start-3 xl:col-span-1 xl:row-start-1">
                <label for="review">Avis</label>
                <textarea
                    id="review"
                    name="review"
                    rows="5"
                    maxlength="5000"
                    placeholder="Avis sur le film"
                    class="w-full md:h-40 xl:h-auto xl:flex-1 p-2 border border-(--secondary-color) bg-(--primary-color) text-(--secondary-color) placeholder-(--secondary-color) rounded mb-1"
                ></textarea>
                <p id="review-warning" class="text-amber-500 text-xs hidden mb-2">Attention : vous approchez de la limite (<span id="review-count">0</span>/5000)</p>
            </div>
        </form>
    </div>
</div>
