<!-- Add movie modal -->
<div
    id="add-modal"
    class="fixed inset-0 bg-black/75 flex items-center justify-center z-50 hidden"
>
    <div class="bg-(--primary-color) rounded-lg p-6 w-auto max-w-xl mx-4 max-h-[85vh] overflow-y-auto">
        <form id="add-form" method="post" action="/add_movie_watchlist">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="movie_add" id="movie_add" value="">
            <div>
                <label for="title" class="font-semibold">Titre du film</label>
                <input
                    id="title"
                    name="title"
                    type="text"
                    placeholder="Tapez pour rechercher..."
                    required
                    autocomplete="off"
                    aria-autocomplete="list"
                    aria-controls="corresponding-poster"
                    class="w-full p-2 border border-(--secondary-color) bg-(--primary-color) text-(--secondary-color) placeholder-(--secondary-color) rounded mb-2"
                />
                <p class="text-xs text-gray-500 mb-2">Résultats mis à jour à la frappe — cliquez sur une affiche pour ajouter</p>

                <div id="corresponding-poster" role="listbox" class="flex flex-wrap gap-3 mb-4 min-h-[1rem] justify-center items-start max-w-full overflow-hidden">
                </div>
            </div>
        </form>
    </div>
</div>
